server:
  port: 8083  # 网关服务端口，避免与 order 模块冲突

spring:
  application:
    name: order-service  # 这个很重要，是服务注册到 Nacos 的名称
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://172.17.0.1:5432/shopdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: xxxx
    password: xxxx
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
file:
  upload:
    path: /app/shop-admin/uploads/        # 文件存储根目录
    domain: http://pic.xxxxx.site  # 访问域名
    max-size: 2097152             # 2MB

  # MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.mntech.shopadmin.model
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 日志配置
logging:
  level:
    com.mntech.shop.product.dao: debug
    com.mntech.shop.product.service: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
# JWT 配置
jwt:
  secret: xxxxx
  expiration: 604800000 # 7天